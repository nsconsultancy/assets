services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - 80:80
      - 81:81
      - 443:443
    environment:
      TZ: Asia/Kolkata
    volumes:
      - /docker/npm_data:/data
      - /docker/lts_data:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:81/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    external: true
