services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - 80:80
      - 81:81
      - 443:443
    environment:
      TZ: Asia/Kolkata
    volumes:
      - /docker/npm_data:/data
      - /docker/lts_data:/etc/letsencrypt
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    external: true
