services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${db_user}
      - MONGO_INITDB_ROOT_PASSWORD=${db_pswd}
    volumes:
      - mongodb-data:/data/db
    networks:
      - reverse-proxy
      - mongodb
    command: ["mongod", "--bind_ip_all"]

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - 8082:8081
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${db_user}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${db_pswd}
      - ME_CONFIG_BASICAUTH_ENABLED=true
      - ME_CONFIG_BASICAUTH_USERNAME=${web_user}
      - ME_CONFIG_BASICAUTH_PASSWORD=${web_pswd}

    depends_on:
      - mongodb
    networks:
      - reverse-proxy
      - mongodb

volumes:
  mongodb-data:

networks:
  mongodb:
    external: true
  reverse-proxy:
    external: true
