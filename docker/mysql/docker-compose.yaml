services:
  mysql:
    image: mysql:latest
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "N7i9T8i0N3@6"
    volumes:
      - /docker/mysql-data:/var/lib/mysql
    ports:
      - 3306:3306
    networks:
      - reverse-proxy
      - mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    volumes:
      - /docker/pma-config:/etc/phpmyadmin
      - /docker/pma-themes:/var/www/html/themes
    ports:
      - 8081:80
    networks:
      - mysql
      - reverse-proxy

networks:
  mysql:
    external: true
  reverse-proxy:
    external: true
