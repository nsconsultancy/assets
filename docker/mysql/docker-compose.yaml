services:
  mysql:
    image: mysql:latest
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${db_pswd}
    volumes:
      - /docker/mysql-data:/var/lib/mysql
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reverse-proxy
      - mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    volumes:
      - /docker/pma-config:/etc/phpmyadmin
      - /docker/pma-themes:/var/www/html/themes1
    ports:
      - 8081:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/robots.txt"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mysql
      - reverse-proxy

networks:
  mysql:
    external: true
  reverse-proxy:
    external: true
